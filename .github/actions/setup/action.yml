name: Set up check tools
description: Python, Node and the pinned plugin validator CLI used by npm run check.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Install the plugin validator CLI
      shell: bash
      run: npm install --global @anthropic-ai/claude-code@2.1.309
