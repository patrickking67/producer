name: Release plugin bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Package plugin
        run: bash scripts/package-plugin.sh

      - name: Validate repository
        run: python3 scripts/check-repository.py

      - name: Publish release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/producer.plugin --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
