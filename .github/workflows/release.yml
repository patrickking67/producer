name: Release plugin bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # The check fails when the committed bundle differs from a fresh
      # build, so the release ships exactly what is in the tagged commit.
      - name: Run checks
        run: npm run check

      - name: Confirm the tag matches the plugin version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("plugins/producer/.claude-plugin/plugin.json"))["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version v$version" >&2
            exit 1
          fi

      - name: Publish release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/producer.plugin --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
